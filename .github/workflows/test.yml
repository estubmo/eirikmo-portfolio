name: test

on:
    push:
        branches: [main]
    pull_request:

# Test-only job: it needs nothing but the source. Pinned here rather than
# inherited, so flipping the repository default to read/write does not silently
# hand a write-capable token to a job that executes fork PR code.
permissions:
    contents: read

# A fork can otherwise queue an unbounded number of 20-minute jobs by pushing
# repeatedly to one PR.
concurrency:
    group: test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            # Third-party action, so pinned to a commit rather than a tag anyone
            # upstream can repoint.
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install Playwright browsers
              run: bunx playwright install --with-deps chromium

            - name: Lint
              run: bun run lint

            - name: Run end-to-end tests
              run: bun run test

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
